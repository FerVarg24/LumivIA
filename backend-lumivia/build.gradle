plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.lumivia'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.osgeo.org/repository/release/')
    }
    maven {
        url = uri('https://repo.osgeo.org/repository/geotools-releases/')
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.graphhopper:graphhopper-core:9.1'

    implementation('org.geotools:gt-main:31.3') {
        exclude group: 'javax.media', module: 'jai_core'
    }
    implementation('org.geotools:gt-referencing:31.3') {
        exclude group: 'javax.media', module: 'jai_core'
    }
    implementation 'org.locationtech.jts:jts-core:1.20.0'
    // For reading GeoTIFF elevation data
    implementation 'com.twelvemonkeys.imageio:imageio-tiff:3.10.1'

    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    jvmArgs = ['-Xmx4g']
}
