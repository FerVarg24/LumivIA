spring:
  application:
    name: lumivia-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lumivia}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}

lumivia:
  osm-file: ./data/cdmx.osm.pbf
  graph-cache: ./data/graph-cache
  flood:
    dem-file: ./data/elevation/cdmx_dem.tif
    elevation-weight: 0.4
    report-weight: 0.6
    risk-threshold: 0.5
